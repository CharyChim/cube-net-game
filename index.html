<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071427">
  <meta name="description" content="五关二十五题的高中立体几何互动闯关游戏">
  <title>空间折叠局 · 立体几何进阶挑战</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="grid-floor"></span>
  </div>

  <main class="app-shell" id="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="回到游戏开头">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><b>空间折叠局</b><small>SPATIAL LAB · 50</small></span>
      </a>
      <div class="top-actions">
        <span class="mini-stat"><em id="score">0</em><small>得分</small></span>
        <span class="mini-stat"><em id="streak">0</em><small>连胜</small></span>
        <button class="icon-btn" id="musicBtn" type="button" aria-label="切换背景音乐" aria-pressed="true">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="music-label">音乐开</span>
        </button>
      </div>
    </header>

    <nav class="route" id="route" aria-label="关卡进度"></nav>

    <section class="game-card">
      <div class="question-pane">
        <div class="question-meta">
          <span class="level-chip" id="levelName">第一关</span>
          <span class="counter" id="questionCounter">01 / 50</span>
        </div>
        <h1 id="question">正在装载空间坐标……</h1>
        <p class="hint" id="hint"></p>
        <div class="stage" id="stage" aria-live="polite"></div>
      </div>

      <aside class="answer-pane">
        <div class="answer-heading">
          <span>选择答案</span>
          <small>SELECT ONE</small>
        </div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="question-actions">
          <button class="ghost-btn" id="retryBtn" type="button" hidden>再想一次</button>
          <button class="next-btn" id="nextBtn" type="button" disabled>
            <span>确认后继续</span><b aria-hidden="true">→</b>
          </button>
        </div>
      </aside>
    </section>

    <footer class="footer-note">
      <span>拖动思维，不必拖动图形</span>
      <span>可见棱 <i class="line-solid"></i> 隐藏棱 <i class="line-dash"></i></span>
    </footer>
  </main>

  <section class="start-overlay" id="startOverlay" aria-labelledby="startTitle">
    <div class="portal" aria-hidden="true">
      <div class="portal-cube"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="start-copy">
      <span class="eyebrow">SPATIAL GEOMETRY · ADVANCED</span>
      <h2 id="startTitle">欢迎进入<br><em>空间折叠局</em></h2>
      <p>5 个进阶关卡，50 道动态图形题。<br>戴上耳机，启动你的空间想象力。</p>
      <div class="mission-row">
        <span><b>05</b>关卡</span><span><b>50</b>题目</span><span><b>∞</b>重试</span>
      </div>
      <button class="launch-btn" id="startBtn" type="button"><span>开始挑战</span><b>ENTER</b></button>
      <small class="audio-note">点击开始后播放原创国风 R&amp;B 器乐循环，可随时关闭</small>
    </div>
  </section>

  <section class="final-modal" id="finalModal" hidden aria-labelledby="finalTitle">
    <div class="final-card">
      <div class="final-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
      <span class="eyebrow">MISSION COMPLETE</span>
      <h2 id="finalTitle">空间任务完成</h2>
      <strong id="finalScore">0 / 50</strong>
      <p id="finalText"></p>
      <div class="rank-grid" id="rankGrid"></div>
      <button class="launch-btn" id="restartBtn" type="button"><span>重新挑战</span><b>REPLAY</b></button>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
